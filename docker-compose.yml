services:
  db:
    image: postgres:16-alpine
    container_name: shiftsync_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shiftsync
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shiftsync']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    container_name: shiftsync_server
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/shiftsync?sslmode=disable
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=shiftsync-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started
    restart: always

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: shiftsync_lgtm
    ports:
      - '3002:3000'
      - '4317:4317'
      - '4318:4318'
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/grafana/conf/provisioning/dashboards/shiftsync/shiftsync-overview.json
    volumes:
      - ./tools/observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shiftsync.yaml:ro
      - ./tools/observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/shiftsync:ro
      - lgtm_data:/data
    restart: always

  client:
    build:
      context: .
      dockerfile: Dockerfile-client
      args:
        - VITE_API_URL=http://localhost:3001/api/v1
    container_name: shiftsync_client
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=http://localhost:3001/api/v1
    depends_on:
      - server
    restart: always

volumes:
  postgres_data:
  lgtm_data:
