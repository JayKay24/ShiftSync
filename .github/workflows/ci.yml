name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install Dependencies & Resolve Nx SHAs
    runs-on: ubuntu-latest
    outputs:
      nx_base: ${{ steps.affected-e2e.outputs.nx_base }}
      nx_head: ${{ steps.affected-e2e.outputs.nx_head }}
      server_e2e_affected: ${{ steps.affected-e2e.outputs.server_e2e }}
      client_e2e_affected: ${{ steps.affected-e2e.outputs.client_e2e }}
      client_affected: ${{ steps.affected-e2e.outputs.client }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Derive base and head SHAs for Nx
        id: set-shas
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - name: Calculate affected projects for E2E gating
        id: affected-e2e
        env:
          RESOLVED_BASE: ${{ steps.set-shas.outputs.base }}
          RESOLVED_HEAD: ${{ steps.set-shas.outputs.head }}
        run: |
          BASE="${RESOLVED_BASE:-HEAD~1}"
          HEAD="${RESOLVED_HEAD:-HEAD}"
          echo "Using base SHA: $BASE"
          echo "Using head SHA: $HEAD"
          echo "nx_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "nx_head=$HEAD" >> "$GITHUB_OUTPUT"

          AFFECTED=$(npx nx show projects --affected --base="$BASE" --head="$HEAD")
          echo "Affected projects:"
          echo "$AFFECTED"

          if echo "$AFFECTED" | grep -qx "server-e2e"; then
            echo "server_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "server_e2e=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$AFFECTED" | grep -qx "client-e2e"; then
            echo "client_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "client_e2e=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$AFFECTED" | grep -qx "client"; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    needs: install
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Validate PR commits with commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: install
    env:
      NX_BASE: ${{ needs.install.outputs.nx_base }}
      NX_HEAD: ${{ needs.install.outputs.nx_head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-lint-
            ${{ runner.os }}-nx-

      - name: Run lint and typecheck for affected projects
        run: npx nx affected -t lint typecheck --base=$NX_BASE --head=$NX_HEAD

      - name: Verify BDD living documentation is up-to-date
        run: npm run bdd:docs:check

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: install
    env:
      NX_BASE: ${{ needs.install.outputs.nx_base }}
      NX_HEAD: ${{ needs.install.outputs.nx_head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-

      - name: Build affected applications
        run: npx nx affected -t build --base=$NX_BASE --head=$NX_HEAD

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    env:
      NX_BASE: ${{ needs.install.outputs.nx_base }}
      NX_HEAD: ${{ needs.install.outputs.nx_head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-test-
            ${{ runner.os }}-nx-

      - name: Run affected unit tests
        run: npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD

  test-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: install
    if: needs.install.outputs.server_e2e_affected == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'shiftsync' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'password123' }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB || 'shiftsync_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://shiftsync:password123@localhost:5432/shiftsync_test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'supersecretjwtkeyforlocaltestingandci1234567890' }}
      PORT: 3001
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-server-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-

      - name: Push database schema
        run: npx drizzle-kit push

      - name: Seed test database
        run: npm run db:seed -- --full

      - name: Run server E2E test suite
        run: npx nx e2e server-e2e

  client-e2e:
    name: Client UI E2E Tests
    runs-on: ubuntu-latest
    needs: install
    if: needs.install.outputs.client_e2e_affected == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'shiftsync' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'password123' }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB || 'shiftsync_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://shiftsync:password123@localhost:5432/shiftsync_test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'supersecretjwtkeyforlocaltestingandci1234567890' }}
      PORT: 3001
      VITE_API_URL: http://localhost:3001/api
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-client-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-

      - name: Push database schema
        run: npx drizzle-kit push

      - name: Seed test database
        run: npm run db:seed -- --full

      - name: Run client Playwright E2E test suite
        run: npx nx e2e client-e2e

      - name: Upload BDD Cucumber living documentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-living-documentation-html
          path: dist/bdd-report
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/client-e2e
          retention-days: 7

  storybook:
    name: Storybook Docs & Component Tests
    runs-on: ubuntu-latest
    needs: install
    if: needs.install.outputs.client_affected == 'true'
    env:
      VITE_API_URL: http://localhost:3001/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build static Storybook docs
        run: npx nx run client:build-storybook

      - name: Run automated Storybook Chromium component & a11y tests
        run: npx nx run client:test-storybook

      - name: Upload Storybook documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-living-documentation
          path: dist/storybook/client
          retention-days: 14
